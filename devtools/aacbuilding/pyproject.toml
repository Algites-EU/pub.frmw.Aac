[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-algites-pub-frmw-aac-aacbuilding"
version = "1.0.dev0"
description = "Algites AAC repository development tools"
requires-python = ">=3.13"

[tool.setuptools]
package-dir = {"" = "src/product/python"}
py-modules = ["build_all", "check_conventions", "python_layout", "sync_versions", "test_all", "versioning"]
