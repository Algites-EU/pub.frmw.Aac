[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-algites-pub-frmw-aac-aaccodegen"
version = "1.0.dev0"
description = "Public shared code generators for Algites Application Components"
requires-python = ">=3.13"
dependencies = [
  "eu-algites-pub-frmw-aac-coreintf==1.0.dev0",
  "eu-algites-pub-frmw-aac-coreimpl==1.0.dev0",
  "PyYAML>=6",
  "jsonschema>=4.20",
]

[project.scripts]
aaccodegen = "eu.algites.frmw.aac.codegen.cli:main"

[tool.setuptools.packages.find]
where = ["src/product/python"]
include = ["eu.algites.frmw.aac.codegen*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.pytest.ini_options]
cache_dir = "../../../build/run/devtools/generators/aaccodegen/run/develop/pytest/cache"
testpaths = ["src/develop/python"]
addopts = "--import-mode=importlib"
