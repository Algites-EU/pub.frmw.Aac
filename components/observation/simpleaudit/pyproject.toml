[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-algites-pub-frmw-aac-simpleaudit"
version = "1.0.dev0"
description = "Simple AAC observation provider"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
authors = [{name = "Algites"}]
dependencies = ["eu-algites-pub-frmw-aac-coreintf==1.0.dev0"]

[tool.setuptools.packages.find]
where = ["src/product/python"]
include = ["eu.algites.frmw.aac.observation.simpleaudit*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["**/*"]


[tool.pytest.ini_options]
testpaths = ["src/develop/python"]
addopts = "--import-mode=importlib"
cache_dir = "../../../build/run/components/observation/simpleaudit/run/develop/pytest/cache"
