Component:
  Id: _AAC.component.dataentity.yamlfsdes
  Version: 1
  Name:
    Text: YAML File-System Data Entity Storage
    ResourceKey: aac.dataentity.yamlfsdes.component.name
  Description:
    Text: Stores AAC Data Entity records as YAML files partitioned by canonical 
      schema ID and stored schema version.
    ResourceKey: aac.dataentity.yamlfsdes.component.description
  CapabilityProviders:
  - Id: yamlfsdes
    Name:
      Text: YAML File-System Data Entity Storage provider
      ResourceKey: aac.dataentity.yamlfsdes.provider.name
    Description:
      Text: Provides generic AAC Data Entity loading, direct storing, physical 
        storage-support management, and provider-consistent backup/restore over 
        a YAML filesystem layout.
      ResourceKey: aac.dataentity.yamlfsdes.provider.description
    Capabilities:
    - Id: _AAC.data-entity.get-record
      Versions:
      - 1
    - Id: _AAC.data-entity.query-records
      Versions:
      - 1
    - Id: _AAC.data-entity.apply-direct-record-changes
      Versions:
      - 1
    - Id: _AAC.data-entity.inspect-storage-support
      Versions:
      - 1
    - Id: _AAC.data-entity.ensure-storage-support
      Versions:
      - 1
    - Id: _AAC.data-entity.retire-storage-support
      Versions:
      - 1
    - Id: _AAC.data-entity.create-storage-backup
      Versions:
      - 1
    - Id: _AAC.data-entity.inspect-storage-backup
      Versions:
      - 1
    - Id: _AAC.data-entity.restore-storage-backup
      Versions:
      - 1
    ImplementationClasses:
    - TechnologyKind: python
      ClassName: 
        eu.algites.frmw.aac.dataentity.yamlfsdes.provider:AIcYamlFsDataEntityStorageProvider
    ConfigurationSchema:
      Id: _AAC.schema.yamlfsdes-config
      WriteVersion: 1
      ReadableVersions:
      - 1
      Resource: schemas/yamlfsdes-config_1.json
    Operations:
    - Capability: _AAC.data-entity.get-record
      CapabilityVersion: 1
      Operation: get
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
    - Capability: _AAC.data-entity.query-records
      CapabilityVersion: 1
      Operation: query
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
        - on_demand_delta
        - on_change_complete
        - on_change_delta
        - always_complete
    - Capability: _AAC.data-entity.apply-direct-record-changes
      CapabilityVersion: 1
      Operation: apply
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
        - on_demand_delta
        - on_change_complete
        - on_change_delta
        - always_complete
        ProgressReporting: true
        Cancellation: true
        ReportingInterval: true
    - Capability: _AAC.data-entity.inspect-storage-support
      CapabilityVersion: 1
      Operation: inspect
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
    - Capability: _AAC.data-entity.ensure-storage-support
      CapabilityVersion: 1
      Operation: ensure
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
    - Capability: _AAC.data-entity.retire-storage-support
      CapabilityVersion: 1
      Operation: retire
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
    - Capability: _AAC.data-entity.create-storage-backup
      CapabilityVersion: 1
      Operation: create_backup
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
        ProgressReporting: true
        Cancellation: true
        ReportingInterval: true
    - Capability: _AAC.data-entity.inspect-storage-backup
      CapabilityVersion: 1
      Operation: inspect_backup
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
        ProgressReporting: true
        Cancellation: true
        ReportingInterval: true
    - Capability: _AAC.data-entity.restore-storage-backup
      CapabilityVersion: 1
      Operation: restore_backup
      Interaction:
        SupportedStateResultDeliveryModes:
        - on_demand_complete
        ProgressReporting: true
        Cancellation: true
        ReportingInterval: true
