# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds:
  - python
  Name: Algites Application Components YAML File-System Data Entity Storage
  Description: YAML file-system implementation of AAC generic Data Entity 
    storage capabilities

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.frmw.aac
        ArtifactId: pub.frmw.Aac_aac.coreintf
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.frmw.aac
        ArtifactId: pub.frmw.Aac_aac.coreimpl
        Usages: [develop_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
  - DependencyKind: python
    Items:
      - ArtifactId: PyYAML
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=6"
      - ArtifactId: jsonschema
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=4.20"
      - ArtifactId: pytest
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=8"
