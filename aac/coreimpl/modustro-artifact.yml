# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/modustro-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds:
  - java
  - python
  Name: Algites Application Components Core Implementation
  Description: Reusable implementations of the Algites Application Components 
    runtime in specified technologies

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.frmw.aac
        ArtifactId: pub.frmw.Aac_aac.coreintf
        Usages: [product_implementation]
      - GroupId: eu.algites.frmw.aac
        ArtifactId: pub.frmw.Aac_components.observation.simpleaudit
        Usages: [develop_implementation]
  - DependencyKind: python
    Items:
      - ArtifactId: PyYAML
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=6"
      - ArtifactId: jsonschema
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=4.20"
      - ArtifactId: pytest
        Usages: [develop_implementation]
        VersionRequirement:
          Minimum: ">=8"
