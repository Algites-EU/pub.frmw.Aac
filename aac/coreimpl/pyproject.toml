[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-algites-pub-frmw-aac-coreimpl"
version = "1.0.dev0"
description = "Reusable Python implementation of Algites Application Components"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
authors = [{name = "Algites"}]
dependencies = [
  "eu-algites-pub-frmw-aac-coreintf==1.0.dev0",
  "PyYAML>=6",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
develop = [
  "pytest>=8",
  "eu-algites-pub-frmw-aac-simpleaudit==1.0.dev0",
]

[tool.setuptools.packages.find]
where = ["src/product/python"]
include = ["eu.algites.frmw.aac.core*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["src/develop/python"]
addopts = "--import-mode=importlib"
cache_dir = "../../build/run/aac/coreimpl/run/develop/pytest/cache"
