[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algites-aac-coreintf"
version = "1.0.dev0"
description = "Public Python bindings for Algites Application Components"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
authors = [{name = "Algites"}]

[tool.setuptools.packages.find]
where = ["src/product/python"]
include = ["algites.frmw.aac.coreintf*"]
namespaces = true

[tool.setuptools.package-data]
"algites.frmw.aac.coreintf" = ["dataentity/definitions/*.yml", "observation/definitions/*.yml", "runtime/definitions/*.yml"]

[tool.pytest.ini_options]
testpaths = ["src/develop/python"]
addopts = "--import-mode=importlib"
cache_dir = "../../build/run/aac/coreintf/run/develop/pytest/cache"
