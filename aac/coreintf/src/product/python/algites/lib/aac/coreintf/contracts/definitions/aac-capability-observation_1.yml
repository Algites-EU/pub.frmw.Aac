capability:
  id: _AAC.capability.observation
  version: 1
  group_id: _AAC.runtime.observation
  name:
    text: Capability invocation observation
    resource_key: aac.capability.observation.name
  description:
    text: Observes normalized capability invocations before and after provider execution.
    resource_key: aac.capability.observation.description
operations:
  - id: observe
    name:
      text: Observe invocation
      resource_key: aac.capability.observation.operation.observe.name
    description:
      text: Delivers one normalized PRE or POST capability invocation observation to the observer.
      resource_key: aac.capability.observation.operation.observe.description
    input: AIcObservationInput
    output: AIcObservationOutput
    input_schema: observation-input_1.json
    output_schema: observation-output_1.json
