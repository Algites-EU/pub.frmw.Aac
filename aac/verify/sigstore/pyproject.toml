[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algites-aac-verify-sigstore"
version = "1.0.dev0"
description = "Sigstore verifier for Algites Application Components"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
authors = [{name = "Algites"}]
dependencies = [
  "algites-aac-coreintf==1.0.dev0",
  "sigstore>=4",
]

[tool.setuptools.packages.find]
where = ["src/product/python"]
include = ["algites.lib.aac.verify.sigstore*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["src/develop/python"]
addopts = "--import-mode=importlib"
cache_dir = "run/develop/pytest/cache"
