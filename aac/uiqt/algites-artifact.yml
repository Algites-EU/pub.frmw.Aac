# $schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json
$schema: https://defs.dev.algites.eu/api/yamldefs/eu/algites/tool/build/yamldefs/algites-artifact_1.yamldef.schema.json

Artifact:
  TechnologyKinds:
  - python
  Name: Algites Application Components Qt UI
  Description: Administration UI implementation for AAC in specified 
    technologies (PySide6 for python)

Dependencies:
  - DependencyKind: modustro
    Items:
      - GroupId: eu.algites.frmw.aac
        ArtifactId: pub.frmw.Aac_aac.coreintf
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.frmw.aac
        ArtifactId: pub.frmw.Aac_aac.coreimpl
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
      - GroupId: eu.algites.frmw.aac
        ArtifactId: pub.frmw.Aac_aac.uiintf
        Usages: [product_implementation]
        VersionRequirement:
          Exact: "1.0-SNAPSHOT"
  - DependencyKind: python
    Items:
      - ArtifactId: PySide6
        Usages: [product_implementation]
        VersionRequirement:
          Minimum: ">=6.7"
